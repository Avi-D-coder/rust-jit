# Stable shared-library packaging; original: Cargo.toml.upstream
[package]
name = "rustc_abi"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[dependencies]
bitflags = "2.4.1"
rustc_hashes = { path = "../rustc_hashes" }
rustc_index = { path = "../rustc_index", default-features = false }
tracing = "0.1"

[features]
default = []
nightly = []
randomize = []
