# Stable shared-library packaging; original: Cargo.toml.upstream
[package]
name = "rustc_type_ir"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[dependencies]
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
derive-where = "1.6.1"
ena = "0.14.4"
indexmap = "2.0.0"
rustc-hash = "2.0.0"
rustc_abi = { path = "../rustc_abi", default-features = false }
rustc_ast_ir = { path = "../rustc_ast_ir", default-features = false }
rustc_index = { path = "../rustc_index", default-features = false }
rustc_type_ir_macros = { path = "../rustc_type_ir_macros" }
smallvec = { version = "1.8.1", default-features = false, features = ["const_generics"] }
thin-vec = "0.2.21"
tracing = "0.1"

[features]
default = []
nightly = []
