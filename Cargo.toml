[workspace]
members = ["crates/lrr", "crates/lrr-expand-adapter", "xtask"]
exclude = ["vendor/rust-analyzer-macros", "vendor/ra-ap-parser", "vendor/rustc-trait-solver"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ra_ap_syntax = "=0.0.356"
cranelift-codegen = "=0.136.2"
cranelift-frontend = "=0.136.2"
cranelift-module = "=0.136.2"
cranelift-jit = "=0.136.2"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
toml = "=1.1.6"
cap-std = "=4.0.3"
proptest = "=1.11.0"
libloading = "=0.8.9"
toml_edit = "=0.23.7"
unicode-normalization = "=0.1.25"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rustc_next_trait_solver = { path = "vendor/rustc-trait-solver/compiler/rustc_next_trait_solver", default-features = false }
rustc_type_ir = { path = "vendor/rustc-trait-solver/compiler/rustc_type_ir", default-features = false }
typed-arena = "=2.0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
# Line tables keep file:line backtraces; full debug info made each lrr rlib
# ~450 MB and exhausted the disk with several concurrent target directories.
debug = "line-tables-only"

# Interpreter development runs spend most preparation time in these pure
# dependency crates (hashing, token trees, macro matching); optimize them in
# dev builds. Workspace crates keep the ordinary dev profile.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.mbe]
opt-level = 3

[profile.dev.package.parser]
opt-level = 3

[profile.dev.package.syntax]
opt-level = 3

[profile.dev.package."syntax-bridge"]
opt-level = 3

[profile.dev.package.span]
opt-level = 3

[profile.dev.package.tt]
opt-level = 3

[profile.dev.package.rowan]
opt-level = 3

[profile.dev.package.ra_ap_parser]
opt-level = 3

[profile.dev.package.ra_ap_syntax]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package."text-size"]
opt-level = 3

[profile.dev.package.smol_str]
opt-level = 3

[profile.dev.package.intern]
opt-level = 3

[profile.dev.package."rustc-hash"]
opt-level = 3

[patch.crates-io]
cranelift-jit = { path = "vendor/cranelift-jit" }
ra_ap_parser = { path = "vendor/ra-ap-parser" }
