effects_may_have_occurred = false
cleanup_runs = false
example = "The bootstrap binary cannot run guest tests."
corrective_command = "Complete the task ledger; this diagnostic is forbidden in a release."
fixtures = ["BOOT-DEVELOPMENT"]

[[diagnostic]]
